name: CI

on:
  pull_request:
    branches: [dev, main]

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      # Enable once the project has tests (Phase 5):
      # - run: flutter test